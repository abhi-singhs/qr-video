[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qr-video"
version = "0.1.0"
description = "Local binary-file transport in QR-code videos with optional authenticated encryption"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<49",
  "numpy>=2.1,<3",
  "zfec>=1.6,<2",
  "zxing-cpp>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
qr-video = "qr_video.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["video: real FFmpeg and QR integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["qrcode.*", "zfec.*", "zxingcpp"]
ignore_missing_imports = true
