[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "qr-video"
dynamic = ["version"]
description = "Local binary-file transport in QR-code videos with optional authenticated encryption"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["binary-transfer", "encryption", "qr-code", "reed-solomon", "video"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: File Sharing",
  "Topic :: Multimedia :: Video",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=44,<49",
  "numpy>=2.1,<3",
  "zfec>=1.6,<2",
  "zxing-cpp>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
  "twine>=6.1,<7",
]

[project.scripts]
qr-video = "qr_video.cli:main"

[project.urls]
Repository = "https://github.com/abhi-singhs/qr-video"
Issues = "https://github.com/abhi-singhs/qr-video/issues"

[tool.hatch.version]
path = "src/qr_video/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["video: real FFmpeg and QR integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["qrcode.*", "zfec.*", "zxingcpp"]
ignore_missing_imports = true
